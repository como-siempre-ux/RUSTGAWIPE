name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  # Cada 3 horas.
  #
  # Con una vez al día no bastaba desde que la lista se ordena por población:
  # a las 05:00 UTC Europa está durmiendo y América acabando, así que la foto
  # salía en el peor momento posible y el orden no reflejaba qué servidores
  # están llenos de verdad. Cada 3 horas siempre hay una foto reciente.
  #
  # Los repos públicos no gastan minutos de Actions, así que esto es gratis.
  schedule:
    - cron: '0 */3 * * *'
  # Para lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se solapan dos despliegues, gana el último; no se cancela el que ya está
# publicando para no dejar el sitio a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Las comprobaciones van antes del build: más vale no publicar que
      # publicar algo roto.
      - name: Tests
        run: npm test

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: Cocinar los datos y construir
        # Un solo paso a propósito: `build:static` ya ejecuta `build:data` por
        # dentro. Cuando esto eran dos pasos, el primero traía los 300
        # servidores de Steam y el segundo los machacaba con el catálogo,
        # porque la clave sólo estaba en el primero. El despliegue salía en
        # verde y publicaba los datos equivocados.
        #
        # Con el secreto STEAM_API_KEY sale la lista en vivo con población e ip
        # reales; sin él, el catálogo. Nunca falla por no tener clave, y la
        # clave no acaba en el sitio publicado: sólo los datos que devuelve.
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          # GitHub Pages publica el proyecto en /<repo>/.
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:static

      - name: Comprobar que se publica lo que se pretendía
        # Este paso existe porque ya pasó: el build salió en verde publicando
        # el catálogo cuando había clave y debía publicar la lista en vivo.
        # Que el despliegue no falle no significa que los datos sean los
        # correctos, así que se comprueba el fichero final.
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          FUENTE=$(node -p "require('./out/data/servers.json').source")
          CUANTOS=$(node -p "require('./out/data/servers.json').count")
          echo "Publicando: fuente=$FUENTE · $CUANTOS servidores"

          if [ -n "$STEAM_API_KEY" ] && [ "$FUENTE" != "steam" ]; then
            echo "✗ Hay clave de Steam pero se iba a publicar '$FUENTE'."
            echo "  Revisa el paso anterior: algo ha sobrescrito los datos en vivo."
            exit 1
          fi
          if [ "$CUANTOS" -lt 100 ]; then
            echo "✗ Sólo $CUANTOS servidores. Algo ha ido mal."
            exit 1
          fi
          echo "✓ Los datos publicados son los esperados."

      - name: Comprobar que la clave no se ha colado en el sitio
        # Red de seguridad: si algún día alguien mete la clave en un componente
        # de cliente, esto revienta el despliegue en vez de publicarla.
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          if [ -z "$STEAM_API_KEY" ]; then
            echo "Sin clave configurada: nada que comprobar."
            exit 0
          fi
          # `grep -l` sólo lista los ficheros. El valor de la clave no se
          # imprime nunca, y GitHub lo enmascararía igualmente.
          AFECTADOS=$(grep -rl "$STEAM_API_KEY" out/ || true)
          if [ -n "$AFECTADOS" ]; then
            echo "✗ La clave de Steam aparece en estos ficheros de out/:"
            echo "$AFECTADOS"
            echo ""
            echo "No se publica nada."
            exit 1
          fi
          echo "✓ Ninguna credencial en out/."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
